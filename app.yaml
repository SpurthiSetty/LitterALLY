name: SmartBin
description: "Sensor -> capture -> classify -> lights, plus a chatbot over the log"
# The chat UI, served by a thread inside the app. Declared here because a port
# is only reachable from outside the container if the manifest publishes it.
ports:
  - 8090
bricks:
  # Local LLM for the chat path. Runs in its own service container, so its
  # latency is nowhere near the real-time path - the two share only the
  # database.
  - arduino:llm

  # arduino:cloud_llm goes here to enable the cloud path. Two things to know
  # before re-adding it:
  #
  #  - it hard-requires an Api_key variable, and the app will not load at all
  #    without one, showing up unnamed and unstartable in App Lab;
  #  - the key lives in App Lab's brick configuration, which "arduino-app-cli
  #    app start" does not load. With this line present the app runs only when
  #    started from App Lab, not over SSH.
  #
  # Everything behind it is written and committed: the UI toggle, the routing,
  # and the fallback to the local model.

  # object_detection was here for the YOLOX crop. Removed: it found the room
  # rather than the held item, the diff detector needs no service, and the
  # container's memory is better spent on the model.
icon: 🗑️
