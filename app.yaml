name: SmartBin
description: "Sensor -> capture -> classify -> lights, plus a chatbot over the log"
ports: []
bricks:
  # Local LLM for the chat path. Runs in its own service container, so its
  # latency is nowhere near the real-time path - the two share only the
  # database.
  - arduino:llm

  # object_detection was here for the YOLOX crop. Removed: it found the room
  # rather than the held item, the diff detector needs no service, and the
  # container's memory is better spent on the model.
icon: 🗑️
