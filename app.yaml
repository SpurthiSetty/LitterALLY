name: SmartBin
description: "Sensor -> capture -> classify -> lights, plus a chatbot over the log"
# The chat UI, served by a thread inside the app. Declared here because a port
# is only reachable from outside the container if the manifest publishes it.
ports:
  - 8090
bricks:
  # Local LLM for the chat path. Runs in its own service container, so its
  # latency is nowhere near the real-time path - the two share only the
  # database.
  - arduino:llm

  # arduino:cloud_llm belongs here, but it hard-requires an Api_key variable at
  # startup - without one the app will not load at all, and App Lab shows it
  # unnamed and unstartable rather than simply running without cloud. Add the
  # key in App Lab's brick credentials panel, then restore this line. All the
  # code behind it - the toggle, the routing, the fallback - is already in place.

  # object_detection was here for the YOLOX crop. Removed: it found the room
  # rather than the held item, the diff detector needs no service, and the
  # container's memory is better spent on the model.
icon: 🗑️
