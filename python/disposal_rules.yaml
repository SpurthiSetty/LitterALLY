# Disposal policy. THE single source of truth for label -> category.
#
# Nothing else in the codebase maps objects to categories. The classifier
# package used to carry its own LOCAL_RULES table and confidence threshold;
# both were removed, because two tables that disagreed would silently produce
# a category the MCU has no colour for.
#
# The labels below are the twelve classes the wastenet model actually emits, in
# the order given by its labels.txt. A label the model never produces is dead
# weight; one it produces that is missing here resolves to "unknown".
#
# Category names are a contract with the MCU: sketch.ino has a matching
# category -> colour/icon/tone table, so a change here needs a change there.

min_confidence: 0.65

categories:
  recyclable:
    labels:
      - cardboard
      - paper
      - plastic
      - metal
      - brown-glass
      - green-glass
      - white-glass

  non-recyclable:
    labels:
      - biological
      - clothes
      - shoes
      - trash

  hazardous:
    labels:
      - battery
