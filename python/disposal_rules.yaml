# Disposal policy. THE single source of truth for label -> category.
#
# Labels are ImageNet class names as emitted by mobilenet_imagenet, shortened to
# the text before the first comma. ImageNet has a thousand classes and almost
# all of them are irrelevant here - animals, vehicles, landscapes - so anything
# not listed resolves to "unknown", which is the desired behaviour rather than a
# gap: a photograph of a kitchen should not be assigned a bin.
#
# Two ImageNet names are traps and are placed by meaning, not by how they read:
# "notebook" is a notebook computer and "mouse" is a computer mouse, so both are
# e-waste rather than stationery.
#
# Category names are a contract with the MCU: sketch.ino has a matching
# category -> colour/icon/tone table, so a change here needs a change there.

min_confidence: 0.25

categories:
  recycle:
    labels:
      # glass and plastic containers
      - beer bottle
      - pop bottle
      - water bottle
      - wine bottle
      - whiskey jug
      - pill bottle
      - water jug
      - beer glass
      - goblet
      - vase
      - bottlecap
      # paper and card
      - carton
      - envelope
      - packet
      - binder
      - book jacket
      - paper towel
      - toilet tissue
      # metal
      - milk can
      - measuring cup

  compost:
    labels:
      - banana
      - orange
      - lemon
      - pineapple
      - strawberry
      - Granny Smith
      - fig
      - pomegranate
      - custard apple
      - jackfruit
      - corn
      - ear
      - broccoli
      - cauliflower
      - zucchini
      - cucumber
      - artichoke
      - bell pepper
      - mushroom
      - head cabbage
      - bagel
      - pretzel
      - cheeseburger
      - hotdog
      - pizza
      - mashed potato

  trash:
    labels:
      - plastic bag
      - lotion
      - sunscreen
      - soap dispenser
      - Band Aid
      - rubber eraser

  hazardous:
    # ImageNet has no battery class, so nothing reaches hazardous with this
    # model. The category stays defined so its colour and icon survive, and so
    # a model that can see a battery needs a change only here.
    labels: []

  ewaste:
    labels:
      - cellular telephone
      - dial telephone
      - laptop
      - notebook
      - desktop computer
      - hand-held computer
      - computer keyboard
      - mouse
      - space bar
      - monitor
      - printer
      - projector
      - modem
      - hard disc
      - iPod
      - CD player
      - cassette
      - cassette player
      - tape player
      - radio
      - remote control
      - joystick
      - loudspeaker
      - microphone
