# Disposal policy. Remapping a label to a different category here needs no retraining.
#
# The labels below are the twelve classes the wastenet model actually emits, in
# the order given by its labels.txt. Do not invent labels: a label the model
# never produces is dead weight, and one it produces that is missing here
# resolves to "unknown".
#
# The category names are a contract with the MCU: sketch.ino has its own
# category -> colour/icon/tone table, so adding a category here means adding it
# there too.

# The single confidence floor for the system. The classifier package carries its
# own CONFIDENCE_THRESHOLD, but the orchestrator does not use it - the floor is
# disposal policy and belongs here, not inside vision.
min_confidence: 0.65

categories:
  recycle:
    labels:
      - cardboard
      - paper
      - plastic
      - metal
      - brown-glass
      - green-glass
      - white-glass

  compost:
    labels:
      - biological

  trash:
    labels:
      - clothes
      - shoes
      - trash

  hazardous:
    labels:
      - battery

  # No label in this model maps to e-waste. The category is kept so the MCU
  # colour and icon stay defined, and so a model that can spot a phone or a
  # cable only needs a change here.
  ewaste:
    labels: []
