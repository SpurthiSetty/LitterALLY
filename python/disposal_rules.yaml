# Disposal policy. THE single source of truth for label -> category.
#
# Labels are the twelve classes the wastenet model emits, in the order given by
# its labels.txt. A label the model never produces is dead weight; one it
# produces that is missing here resolves to "unknown".
#
# Category names are a contract with the MCU: sketch.ino has a matching
# category -> colour/icon/tone table, so a change here needs a change there.
#
# ImageNet MobileNet was tried here and reverted. It is more honest about empty
# scenes, but a thousand general classes means most answers are off-topic -
# "sewing machine" for a kitchen - which is unreadable when the point is to show
# waste sorting. The trade is real either way: wastenet can see a battery and so
# reaches hazardous, but has no class for a phone or a cable, so ewaste stays
# unreachable.

# Correct answers on real items have measured between 0.44 and 0.92, and empty
# scenes between 0.30 and 0.60. A floor of 0.65 was rejecting correct answers
# about half the time; 0.50 accepts them while still turning away most noise.
min_confidence: 0.50

# Everyday words for the labels above, used only by the chatbot - the
# classifier never sees these. Nobody asks which bin "biological" goes in; they
# ask about a banana. Without this the question falls through to the language
# model, which answered "recycle" for a banana, so the aliases are not
# convenience but correctness.
aliases:
  biological:
    [banana, apple, orange, fruit, vegetable, peel, food, food scraps,
     leftovers, eggshell, egg shell, coffee grounds, tea bag, compost, organic]
  cardboard:
    [box, cardboard box, carton, packaging, cereal box, corrugated, shipping box,
     egg carton, pizza box, cardboard tube]
  paper:
    # "notebook" is deliberately absent: it is at least as likely to mean a
    # laptop, and a wrong confident answer is worse than falling through.
    [newspaper, magazine, envelope, receipt, letter, junk mail, printer paper,
     book, wrapping paper]
  laptop:
    [computer, macbook, pc]
  phone:
    [mobile, cellphone, cell phone, smartphone, iphone, android]
  cable:
    [wire, cord, usb cable, charging cable, lead]
  charger:
    [power adapter, adapter, plug, power brick]
  plastic:
    [bottle, plastic bottle, water bottle, tub, wrapper, plastic bag, packet,
     straw, container, cup]
  metal:
    [can, tin, tin can, aluminium, aluminum, foil, drink can, soda can]
  battery:
    [batteries, aa, aaa, aa battery, 9v, coin cell, cell]
  clothes:
    [shirt, t-shirt, clothing, cloth, fabric, textile, jumper, trousers]
  shoes:
    [shoe, trainers, sneakers, boots]
  brown-glass:
    [brown glass, beer bottle]
  green-glass:
    [green glass, wine bottle]
  white-glass:
    [glass, clear glass, glass bottle, jar, glass jar]

categories:
  recycle:
    labels:
      - cardboard
      - paper
      - plastic
      - metal
      - brown-glass
      - green-glass
      - white-glass

  compost:
    labels:
      - biological

  trash:
    labels:
      - clothes
      - shoes
      - trash

  hazardous:
    labels:
      - battery

  # The classifier cannot produce any of these - wastenet has no e-waste class,
  # so the camera will never light this category. They exist so the chatbot can
  # still answer "where does a laptop go", which it otherwise handed to the
  # language model, which replied "the third bin, with the lid closed".
  ewaste:
    labels:
      - laptop
      - phone
      - cable
      - charger
      - headphones
      - remote control
      - circuit board
