<!doctype html>
<meta charset="utf-8">
<title>Smart Bin — chat</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0;
         background: #14161a; color: #e8e8ea; display: flex;
         flex-direction: column; height: 100vh; }
  header { padding: 14px 18px; border-bottom: 1px solid #2a2e35; }
  header b { font-size: 16px; }
  header span { color: #8b929c; margin-left: 10px; font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; }
  .msg { max-width: 640px; margin: 0 0 12px; padding: 10px 14px;
         border-radius: 12px; white-space: pre-wrap; }
  .you { background: #2b6cb0; margin-left: auto; border-bottom-right-radius: 3px; }
  .bin { background: #23262c; border-bottom-left-radius: 3px; }
  .meta { font-size: 12px; color: #7f8792; margin: -6px 0 14px; }
  .escalate { color: #d9a441; }
  form { display: flex; gap: 10px; padding: 14px 18px;
         border-top: 1px solid #2a2e35; }
  input { flex: 1; padding: 11px 14px; border-radius: 9px;
          border: 1px solid #333842; background: #1b1e23; color: inherit; font: inherit; }
  button { padding: 11px 20px; border-radius: 9px; border: 0;
           background: #2b6cb0; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { padding: 0 18px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { background: #23262c; color: #b9c0ca; font-size: 13px;
                  padding: 7px 12px; }
  .cloud { display: flex; align-items: center; gap: 8px; padding: 0 18px 10px;
           color: #8b929c; font-size: 13px; }
  .cloud input { accent-color: #d9a441; }
  .cloud b { color: #d9a441; }
</style>

<header><b>Smart Bin</b><span id="status">connecting…</span></header>
<div id="log"></div>
<div class="chips">
  <button>what have I thrown out today</button>
  <button>what have I thrown out this week</button>
  <button>how do I dispose of a carton</button>
  <button>which bin for a banana</button>
  <button>where does a laptop go</button>
  <button>how do I dispose of a mattress</button>
</div>
<label class="cloud">
  <input type="checkbox" id="cloud">
  <span>Ask the <b>cloud</b> when this bin has no answer — the question leaves the
  device; your bin's records never do.</span>
</label>
<form id="f">
  <input id="q" placeholder="Ask about the bin…" autocomplete="off" autofocus>
  <button id="send">Ask</button>
</form>

<script>
  const log = document.getElementById('log');

  function add(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function note(text, cls) {
    const el = document.createElement('div');
    el.className = 'meta ' + (cls || '');
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  async function ask(question) {
    if (!question.trim()) return;
    add(question, 'you');
    document.getElementById('send').disabled = true;
    // The local model takes the better part of a minute on this hardware, so
    // say so rather than leaving the page looking broken.
    const pending = add('thinking…', 'bin');
    const started = Date.now();
    const tick = setInterval(() => {
      pending.textContent = `thinking… ${Math.round((Date.now() - started) / 1000)}s`;
    }, 1000);
    try {
      const r = await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, allow_cloud: document.getElementById('cloud').checked })
      });

      // Newline-delimited JSON, read as it arrives. A chunk can be split
      // across reads, so keep the tail until a newline completes it.
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', backend = '', text = '', escalate = null, first = true;

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          const msg = JSON.parse(line);
          if (msg.kind === 'meta') backend = msg.payload.backend;
          else if (msg.kind === 'text') {
            if (first) { clearInterval(tick); pending.textContent = ''; first = false; }
            text += msg.payload;
            pending.textContent = text;
            log.scrollTop = log.scrollHeight;
          } else if (msg.kind === 'done') escalate = msg.payload.escalate;
          else if (msg.kind === 'error') { text += '\n[error] ' + msg.payload; pending.textContent = text; }
        }
      }

      clearInterval(tick);
      if (!text) pending.textContent = '(no answer)';
      note(`${backend} · ${Math.round((Date.now() - started) / 1000)}s`);
      // Escalation is shown, not hidden: it is the moment a question would
      // leave the device.
      if (escalate) note('would escalate to cloud — ' + escalate, 'escalate');
    } catch (e) {
      clearInterval(tick);
      pending.textContent = 'server unreachable: ' + e.message;
    }
    document.getElementById('send').disabled = false;
    document.getElementById('q').focus();
  }

  document.getElementById('f').onsubmit = e => {
    e.preventDefault();
    const q = document.getElementById('q');
    ask(q.value); q.value = '';
  };
  document.querySelectorAll('.chips button').forEach(b => {
    b.onclick = () => ask(b.textContent);
  });

  fetch('/api/summary').then(r => r.json()).then(d => {
    const cov = d.coverage || {};
    document.getElementById('status').textContent =
      `${d.total_items} events · log from ${(cov.first_event || '?').slice(0, 16)}`;
    if (!d.cloud_available) {
      const box = document.getElementById('cloud');
      box.disabled = true;
      box.parentElement.lastElementChild.textContent =
        'Cloud unavailable — no API key configured on the board.';
    }
  }).catch(() => {
    document.getElementById('status').textContent = 'no data';
  });
</script>
